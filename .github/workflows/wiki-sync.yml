name: Sync Wiki

on:
  push:
    branches:
      - master
    paths:
      - "wiki/**"
      - ".github/workflows/wiki-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync to GitHub Wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Clone the wiki repository (fallback if not yet initialized)
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          WIKI_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git"
          
          if git clone "$WIKI_URL" wiki-repo 2>/dev/null; then
            echo "Wiki repo cloned successfully."
            cd wiki-repo
            rm -rf *
            cp -r ../wiki/* .
            git add .
            if git diff-index --quiet HEAD; then
              echo "No wiki changes to commit."
            else
              git commit -m "docs(wiki): synchronize wiki pages from master [skip ci]"
              git push origin master
            fi
          else
            echo "Notice: Wiki repository is not yet initialized on GitHub."
            echo "Please visit https://github.com/${{ github.repository }}/wiki and click 'Create the first page' to initialize the wiki repository."
          fi
