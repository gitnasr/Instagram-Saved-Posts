services:
  app:
    # Use :latest for newest production release, or pin/rollback to a specific version
    # (e.g. ghcr.io/gitnasr/instagram-saved-posts:v1.0.1). See GitHub Releases for all tags.
    image: ghcr.io/gitnasr/instagram-saved-posts:latest
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
    container_name: instagram_saved_posts_app
    restart: unless-stopped
    ports:
      - "${PORT:-5050}:3000"
    environment:
      - DATABASE_URL=mongodb://mongo:27017/instagram?replicaSet=rs0&directConnection=true
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Vector search (Qdrant)
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_PORT=${QDRANT_PORT:-6335}
      # Optional: Cloudinary for permanent media CDN
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      # Optional: Logging & Monitoring
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  mongo:
    image: mongo:7.0
    container_name: instagram_saved_posts_mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: >
        mongosh --port 27017 --eval "
          try {
            rs.status().ok
          } catch (e) {
            rs.initiate({
              _id: 'rs0',
              members: [{ _id: 0, host: 'mongo:27017' }]
            }).ok
          }
        " || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 2s

  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: instagram_saved_posts_qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6335}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': >/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 2s

volumes:
  mongo_data:
    name: instagram_saved_posts_mongo_data
  qdrant_data:
    name: instagram_saved_posts_qdrant_data
